server:
  port: 9200

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      max-lifetime: 30000
      connection-test-query: SELECT 1
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss.SSS
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: 465
    protocol: smtp
    default-encoding: UTF-8
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
            required: false
  data:
    redis:
      host: redis
      port: 6379

voice:
  model: /model/faster-whisper-small/
  transitionApi: http://whisper:8000/v1/audio/transcriptions

ai:
  short-memory-size: 10 #短期记忆条数（取会话最近 N 条消息作为上下文）

rocketmq:
  enabled: true
  name-server: ${ROCKET_NAME_SERVER:rmqnamesrv:9876}
  producer:
    group: chat_group
    send-message-timeout: 5000
    retry-times-when-send-failed: 3
    retry-times-when-send-async-failed: 3

minio:
  endpoint: ${MINIO_ENDPOINT} #外部访问地址
  bucketName: chat
  fileBucketName: file
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}

security:
  jwt-secret: ${JWT_SECRET}
  aes-key: ${AES_KEY}

livekit:
  host: ${LIVEKIT_HOST:wss://livekit:7880}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  token-ttl-minutes: ${LIVEKIT_TOKEN_TTL_MINUTES:60}

pushy:
  api-key: ${PUSHY_API_KEY:}
  time-to-live: ${PUSHY_TIME_TO_LIVE:2592000}
