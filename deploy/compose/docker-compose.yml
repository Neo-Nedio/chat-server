version: '3.8'
networks:
  chat:
    driver: bridge
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - /chat/mysql:/var/lib/mysql
      - ../../chat.sql:/docker-entrypoint-initdb.d/chat.sql.template:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-chat.sh:ro
    networks:
      - chat

  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - /chat/redis:/data
    networks:
      - chat

  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: whisper
    ports:
      - "8000:8000"
    volumes:
      - /chat/whisper/model:/model
    networks:
      - chat

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /chat/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - chat

  namesrv:
    image: apache/rocketmq:5.3.0
    container_name: rmqnamesrv
    ports:
      - 9876:9876
    networks:
      - chat
    command: sh mqnamesrv
    environment:
      - JAVA_OPT_EXT=-server -Xms128m -Xmx128m
  broker:
    image: apache/rocketmq:5.3.0
    container_name: rmqbroker
    ports:
      - 10909:10909
      - 10911:10911
      - 10912:10912
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      - JAVA_OPT_EXT=-server -Xms128m -Xmx128m
    depends_on:
      - namesrv
    volumes:
      - ./broker.conf:/home/rocketmq/broker.conf
    networks:
      - chat
    command: sh mqbroker -c /home/rocketmq/broker.conf

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    command: ["--config", "/etc/livekit.yaml", "--keys", "${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}", "--node-ip", "${LIVEKIT_PUBLIC_IP}"]
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - chat

  chat:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: chat-server:latest
    container_name: chat
    depends_on:
      - mysql
      - redis
      - minio
      - whisper
      - namesrv
      - broker
      - livekit
    ports:
      - "9100:9100"
      - "9200:9200"
    networks:
      - chat
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ROCKET_NAME_SERVER: ${ROCKET_NAME_SERVER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      LIVEKIT_HOST: ${LIVEKIT_HOST}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_TOKEN_TTL_MINUTES: ${LIVEKIT_TOKEN_TTL_MINUTES}
